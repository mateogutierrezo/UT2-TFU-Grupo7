events {}

http {
    upstream tfu_api {
        server api1:3000 max_fails=1 fail_timeout=5s;
        server api2:3000 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://tfu_api;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        # Error controlado cuando ambas réplicas están caídas
        error_page 502 503 504 @unavailable;
        location @unavailable {
            default_type application/json;
            return 503 '{"status":"unavailable","message":"Ninguna instancia disponible"}';
        }
    }
}