events {}

http {
    # Rate Limiting centralizado en el gateway:
    # auth: ráfaga de 5 por IP y recarga de 1/min (freno a fuerza bruta en login/register).
    # api:  ráfaga de 100 por IP y recarga de ~7/min; tasks y projects comparten zona.
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=1r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=7r/m;

    limit_req_status 429;
    limit_req_log_level warn;

    # DNS interno de Docker: los nombres se resuelven en tiempo de ejecución,
    # de modo que el gateway arranca y sigue funcionando aunque un servicio
    # esté caído o cambie de IP al reiniciarse.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;

        set $identity_upstream http://identity-service:3000;
        set $projects_upstream http://projects-service:3000;
        set $tasks_upstream    http://tasks-service:3000;

        proxy_connect_timeout 2s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Auth -> Servicio de Identidad (limiter estricto)
        location /api/auth {
            limit_req zone=auth_zone burst=5 nodelay;
            proxy_pass $identity_upstream;
        }

        # Proyectos y Tareas comparten zona de rate limiting
        location /api/projects {
            limit_req zone=api_zone burst=100 nodelay;
            proxy_pass $projects_upstream;
        }

        location /api/tasks {
            limit_req zone=api_zone burst=100 nodelay;
            proxy_pass $tasks_upstream;
        }

        # Salud del propio gateway (sin rate limit)
        location = /api/health {
            default_type application/json;
            return 200 '{"status":"ok","component":"api-gateway"}';
        }

        # Cualquier otra ruta no se publica, incluidas /soap/* y /api/internal/*:
        # SOAP y las rutas internas quedan accesibles solo dentro de la red
        # interna de Docker.
        location / {
            default_type application/json;
            return 404 '{"status":"not_found"}';
        }

        # Error controlado cuando el servicio destino no está disponible
        error_page 502 503 504 =503 @unavailable;
        location @unavailable {
            default_type application/json;
            return 503 '{"status":"unavailable","message":"Servicio no disponible"}';
        }
    }
}
