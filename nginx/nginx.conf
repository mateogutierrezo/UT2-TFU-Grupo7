events {}

http {
    # Rate Limiting centralizado en el gateway:
    # auth: ráfaga de 5 por IP y recarga de 1/min (freno a fuerza bruta en login/register).
    # api:  ráfaga de 100 por IP y recarga de ~7/min; tasks y projects comparten zona.
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=1r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=7r/m;

    limit_req_status 429;
    limit_req_log_level warn;

    upstream tfu_api {
        server api1:3000 max_fails=1 fail_timeout=5s;
        server api2:3000 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;

        # Auth: limiter estricto
        location /api/auth {
            limit_req zone=auth_zone burst=5 nodelay;

            proxy_pass http://tfu_api;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API general: limiter tolerante (tasks + projects comparten zona).
        location /api/tasks {
            limit_req zone=api_zone burst=100 nodelay;

            proxy_pass http://tfu_api;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/projects {
            limit_req zone=api_zone burst=100 nodelay;

            proxy_pass http://tfu_api;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Resto (health, unstable): sin rate limit
        location / {
            proxy_pass http://tfu_api;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
