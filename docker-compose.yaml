x-service-healthcheck: &service-healthcheck
  test:
    [
      "CMD",
      "node",
      "-e",
      "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
    ]
  interval: 5s
  timeout: 3s
  retries: 2
  start_period: 10s

services:
  identity-service:            # nombre DNS = host desde otros servicios
    build: .                   # mismo Dockerfile, distinto CMD
    command: ["node", "src/services/identity/app.js"]
    env_file:
      - .env
    environment:
      - SERVICE_NAME=identity
      - INSTANCE_ID=identity-1
      - DB_PATH=/app/data/identity.sqlite
    volumes:
      - identity-data:/app/data
    expose:
      - "3000"
    healthcheck: *service-healthcheck
    restart: unless-stopped

  projects-service:
    build: .
    command: ["node", "src/services/projects/app.js"]
    env_file:
      - .env
    environment:
      - SERVICE_NAME=projects
      - INSTANCE_ID=projects-1
      - DB_PATH=/app/data/projects.sqlite
      # Proyectos consulta a Identidad (REST interno) para validar usuarios.
      - IDENTITY_SERVICE_URL=http://identity-service:3000
      - IDENTITY_TIMEOUT_MS=2000
    volumes:
      - projects-data:/app/data
    expose:
      - "3000"
    healthcheck: *service-healthcheck
    restart: unless-stopped

  tasks-service:
    build: .
    command: ["node", "src/services/tasks/app.js"]
    env_file:
      - .env
    environment:
      - SERVICE_NAME=tasks
      - INSTANCE_ID=tasks-1
      - DB_PATH=/app/data/tasks.sqlite
      # Tareas consume el servicio SOAP de Proyectos (contrato en ?wsdl).
      - PROJECTS_SOAP_URL=http://projects-service:3000/soap/projects
      - PROJECTS_SOAP_TIMEOUT_MS=2000
    volumes:
      - tasks-data:/app/data
    expose:
      - "3000"
    healthcheck: *service-healthcheck
    # Sin depends_on hacia projects-service: Tareas debe poder iniciar y
    # responder aunque Proyectos esté caído (aislamiento de fallos).
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      identity-service:
        condition: service_healthy
      projects-service:
        condition: service_healthy
      tasks-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  identity-data:
  projects-data:
  tasks-data: