services:

  redis:
    image: redis:alpine
    container_name: redis-queue
    ports:
      - "6379:6379"
    restart: always
  api1:
    build: .
    container_name: tfu-api-1
    env_file:
      - .env
    environment:
      - INSTANCE_ID=api-1
    volumes:
      - ./data:/app/data
    expose:
      - "3000"
    depends_on:
      - redis

  api2:
    build: .
    container_name: tfu-api-2
    env_file:
      - .env
    environment:
      - INSTANCE_ID=api-2
    volumes:
      - ./data:/app/data
    expose:
      - "3000"
    depends_on:
      - redis

  loadbalancer:
    image: nginx:alpine
    container_name: tfu-lb
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api1
      - api2
