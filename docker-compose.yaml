x-api-healthcheck: &api-healthcheck
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 5s
  timeout: 3s
  retries: 2
  start_period: 10s

services:
  api1:
    build: .
    container_name: tfu-api-1
    env_file:
      - .env
    environment:
      - INSTANCE_ID=api-1
      - FORCE_DB_FAIL=${API1_FORCE_DB_FAIL:-false}
    volumes:
      - dbdata:/app/data
    expose:
      - "3000"
    healthcheck: *api-healthcheck

  api2:
    build: .
    container_name: tfu-api-2
    env_file:
      - .env
    environment:
      - INSTANCE_ID=api-2
      - FORCE_DB_FAIL=${API2_FORCE_DB_FAIL:-false}
    volumes:
      - dbdata:/app/data
    expose:
      - "3000"
    healthcheck: *api-healthcheck

  loadbalancer:
    image: nginx:alpine
    container_name: tfu-lb
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy

volumes:
  dbdata: